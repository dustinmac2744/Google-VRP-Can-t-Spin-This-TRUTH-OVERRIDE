name: Capture OIDC Token
on: [push]
jobs:
  capture-exchange:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Capture Raw Token
        run: |
          curl -s -X POST "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"audience": "https://github.com/dustinmac2744"}' > raw_token.txt
          base64 raw_token.txt
